services:
  - type: web
    name: hide-n-hype-cms
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm admin:build
    startCommand: pnpm admin:start
    disk:
      name: cms-data
      mountPath: /opt/render/project/src/admin/.data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: DATABASE_URL
        value: file:/opt/render/project/src/admin/.data/hnh.sqlite
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: STOREFRONT_ORIGIN
        value: https://hidenhype.com,https://www.hidenhype.com
